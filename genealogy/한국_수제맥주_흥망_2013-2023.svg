<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="502" viewBox="0 -46 1000 502" role="img"
           aria-label="한국 수제맥주 시장 규모 막대그래프. 2013년 93억 원에서 2021년 1520억 원으로 16배 성장한 뒤 2023년 752억 원으로 반토막 났다.">
<style>
  :root{
    --panel:#FFFFFF; --panel-2:#F7F9FB; --ink:#12161D; --ink-2:#48515F; --ink-3:#798393;
    --rule-2:#E6EAEF;
    --kirin:#1B7A4B; --sapporo:#A0721A; --asahi:#1F5FA8; --yebisu:#932F48;
    --suntory:#57429E; --orion:#0A716E; --trunk:#454B57;
    --hite:#12736A; --ob:#AE3244; --jinro:#A0721A; --lotte:#57429E; --craft:#1F5FA8; --jp:#798393;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --panel:#161A21; --panel-2:#1B2028; --ink:#E7EAF0; --ink-2:#A7AFBD; --ink-3:#767F8E;
      --rule-2:#232932;
      --kirin:#4FC183; --sapporo:#DFA845; --asahi:#63A3E8; --yebisu:#E17E96;
      --suntory:#9E8AE0; --orion:#3EC0BA; --trunk:#AEB6C4;
      --hite:#3FBDAF; --ob:#E8798C; --jinro:#DFA845; --lotte:#9E8AE0; --craft:#63A3E8; --jp:#7C8695;
    }
  }
  .bg{fill:var(--panel)}
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
  .lane{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  .lane.thin{stroke-width:3}
  .lane.trunk{stroke-width:8.5;stroke:var(--trunk)}
  .lane.ghost{stroke-width:2.5;stroke-dasharray:2 7;opacity:.62}
  .k{stroke:var(--kirin)} .s{stroke:var(--sapporo)} .a{stroke:var(--asahi)}
  .y{stroke:var(--yebisu)} .u{stroke:var(--suntory)} .o{stroke:var(--orion)}
  .fk{fill:var(--kirin)} .fs{fill:var(--sapporo)} .fa{fill:var(--asahi)}
  .fy{fill:var(--yebisu)} .fu{fill:var(--suntory)} .fo{fill:var(--orion)}
  .h{stroke:var(--hite)} .b{stroke:var(--ob)} .j{stroke:var(--jinro)}
  .t{stroke:var(--lotte)} .g{stroke:var(--jp)}
  .fh{fill:var(--hite)} .fb{fill:var(--ob)} .fj{fill:var(--jinro)}
  .ft{fill:var(--lotte)} .fg{fill:var(--jp)} .fc{fill:var(--craft)}
  .dot{stroke:var(--panel);stroke-width:2.5}
  .yr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:var(--ink-3)}
  .yr.big{font-size:17px;fill:var(--ink)}
  .lbl{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .lbl.sub{font-size:11px;font-weight:500;fill:var(--ink-3)}
  .lbl.big{font-size:14px;font-weight:750}
  .foot{font-size:13.5px;font-weight:750;fill:var(--ink)}
  .gridline{stroke:var(--rule-2);stroke-width:1}
  .band{fill:var(--trunk);opacity:.055}
  .axnote{font-size:10.5px;fill:var(--ink-3);font-family:ui-monospace,Menlo,monospace}
  .bar{fill:var(--craft)}
  .svglab{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.18em;fill:var(--ink)}
  .barlab{font-size:12px;font-weight:700;fill:var(--ink);font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" x="0" y="-46" width="1000" height="502"/>

        <line class="gridline" x1="80" y1="330" x2="960" y2="330"/>

        <!-- 2013 : 93억 -->
        <rect class="bar" x="140" y="311" width="120" height="19" rx="2" opacity=".85"/>
        <text class="barlab" x="200" y="303" text-anchor="middle">93억</text>
        <text class="yr" x="200" y="352" text-anchor="middle">2013</text>
        <text class="lbl sub" x="200" y="370" text-anchor="middle">제도 이전</text>

        <!-- 2021 : 1520억 -->
        <rect class="bar" x="440" y="70" width="120" height="260" rx="2"/>
        <text class="barlab" x="500" y="60" text-anchor="middle">1,520억</text>
        <text class="yr" x="500" y="352" text-anchor="middle">2021</text>
        <text class="lbl sub" x="500" y="370" text-anchor="middle">정점 · 16배</text>

        <!-- 2023 : 752억 -->
        <rect class="bar" x="740" y="201" width="120" height="129" rx="2" opacity=".85"/>
        <text class="barlab" x="800" y="193" text-anchor="middle">752억</text>
        <text class="yr" x="800" y="352" text-anchor="middle">2023</text>
        <text class="lbl sub" x="800" y="370" text-anchor="middle">반토막</text>

        <!-- 상승 / 하강 표시 -->
        <path d="M270 300 L430 90" fill="none" stroke="var(--craft)" stroke-width="2" stroke-dasharray="4 4" opacity=".55"/>
        <path d="M570 80 L730 195" fill="none" stroke="var(--ob)" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>

        <text class="lbl" x="300" y="180" fill="var(--craft)">2014 주세법 개정</text>
        <text class="lbl sub" x="300" y="196">2020 종량세 · 2021 OEM 허용</text>
        <text class="lbl sub" x="300" y="212">2020 곰표 밀맥주 — 3년 6,000만 캔</text>

        <text class="lbl" x="600" y="128" fill="var(--ob)">2023 곰표 상표권 분쟁</text>
        <text class="lbl sub" x="600" y="144">2025 세븐브로이 법정관리</text>
        <text class="lbl sub" x="600" y="160">2026 어메이징브루잉 파산</text>

        <text class="axnote" x="80" y="404">단위 억 원 · 국내 수제맥주 시장 규모 — 출처 자료에 있는 3개 연도만 표시</text>
      
        <text class="svglab" x="90" y="-16" style="font-size:11px">SK YOPPARATTE LAB</text>
        <text class="svglab" x="920" y="446" text-anchor="end" style="font-size:11px">SK YOPPARATTE LAB</text>
      </svg>