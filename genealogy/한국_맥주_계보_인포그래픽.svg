<circle class="disc" cx="250" cy="200" r="32" stroke="var(--hite)"/>
<g transform="translate(250,200)"><path d="M0 -16 q11 13 11 20 a11 11 0 0 1 -22 0 q0 -7 11 -20 z" fill="var(--hite)"/></g>
<text class="hd" x="300" y="184">1933.08 · <tspan class="pr">조선맥주</tspan>(주)</text>
<text class="bd" x="300" y="208">대일본맥주 자본 — 일본에서</text>
<text class="bd" x="300" y="229">아사히·삿포로와 같은 뿌리.</text>

<circle class="disc" cx="640" cy="310" r="32" stroke="var(--ob)"/>
<g transform="translate(640,310)"><path d="M-11 -16 h22 v32 h-22 z" fill="var(--ob)"/><rect x="-12" y="-18" width="24" height="4" rx="1.5" fill="var(--ob)"/></g>
<text class="hd" x="690" y="296">1933.12 · <tspan class="pr">소화기린맥주</tspan>(주)</text>
<text class="bd" x="690" y="320">기린맥주 자본 — 넉 달 차이로 다른 계보에서 태어난다.</text>

<circle class="disc" cx="250" cy="450" r="26" stroke="var(--hite)"/>
<circle class="disc" cx="640" cy="450" r="26" stroke="var(--ob)"/>
<text class="hd" x="300" y="438" style="font-size:18.2px">1948 · 조선맥주(주)</text>
<text class="bd" x="300" y="462">상표 <tspan class="pr">크라운</tspan></text>
<text class="hd" x="690" y="438" style="font-size:18.2px">1948 · <tspan class="pr">동양맥주</tspan>(주)로 상호 변경 — 상표 <tspan class="pr">OB</tspan> 등장</text>
<text class="bd" x="690" y="462">광복 후 적산관리를 거쳐 민간 이관. 소화기린이라는 이름은 여기서 사라진다.</text>
<text class="bd" x="690" y="483">이때 붙은 상표 OB는 오늘의 <tspan class="pr">오비라거</tspan>까지 77년째 이어진다.</text>

<rect x="628" y="568" width="24" height="24" rx="4" fill="var(--ob)" stroke="var(--panel)" stroke-width="4"/>
<path d="M656 580 H1195" stroke="var(--ob)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fb" x="1210" y="570" style="font-size:18.2px">1991 · 낙동강 페놀 유출</text>
<text class="bd" x="1210" y="594">OB 모기업 두산 계열 공장 사고.</text>
<text class="bd" x="1210" y="615">전국 불매운동으로 번진다.</text>

<circle class="disc" cx="870" cy="670" r="24" stroke="var(--jinro)" stroke-width="4"/>
<g transform="translate(870,670)"><path d="M-14 -2 l7 -6 7 5 7 -5 7 6 -14 10 z" fill="var(--jinro)"/></g>
<text class="bd" x="870" y="548" text-anchor="middle">진로그룹 (소주) — 맥주 아님</text>
<path d="M1022 720 H1195" stroke="var(--jinro)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fj" x="1210" y="668" style="font-size:18.2px">1992 · <tspan class="pr">진로쿠어스맥주</tspan> 설립</text>
<text class="bd" x="1210" y="692">소주 1위 진로가 미국 쿠어스와</text>
<text class="bd" x="1210" y="713">합작해 제3의 축으로 진입.</text>

<circle class="disc" cx="250" cy="760" r="30" stroke="var(--hite)"/>
<g transform="translate(250,760)"><path d="M0 -15 q10 12 10 19 a10 10 0 0 1 -20 0 q0 -7 10 -19 z" fill="var(--hite)"/><path d="M-4 4 h8" stroke="var(--panel)" stroke-width="2.6" stroke-linecap="round"/></g>
<text class="hd" x="300" y="748">1993 · <tspan class="pr">하이트</tspan> 출시</text>
<text class="bd" x="300" y="772">"지하 150m 천연암반수" —</text>
<text class="bd" x="300" y="793">페놀 사건의 반사 마케팅.</text>

<circle class="disc" cx="990" cy="845" r="28" stroke="var(--jinro)"/>
<g transform="translate(990,845)"><path d="M-9 -13 h18 v26 h-18 z" fill="var(--jinro)"/><rect x="-10" y="-15" width="20" height="3.5" rx="1.5" fill="var(--jinro)"/></g>
<path d="M1020 845 H1195" stroke="var(--jinro)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fj" x="1210" y="836" style="font-size:18.2px">1994 · <tspan class="pr">카스</tspan> 출시</text>
<text class="bd" x="1210" y="860">Cold filtering · Advanced technology ·</text>
<text class="bd" x="1210" y="881">Smooth taste · Satisfying feeling의 두문자.</text>

<circle class="disc" cx="640" cy="920" r="26" stroke="var(--ob)"/>
<g transform="translate(640,920)"><path d="M-10 -6 h20 v12 h-20 z" fill="var(--ob)"/></g>
<path d="M668 920 H1195" stroke="var(--ob)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fb" x="1210" y="936" style="font-size:18.2px">1995 · 사명을 <tspan class="pr">OB맥주</tspan>(주)로 변경</text>
<text class="bd" x="1210" y="960">47년간 상표였던 OB가 회사 이름이 된다.</text>

<circle class="disc" cx="250" cy="1000" r="30" stroke="var(--hite)"/>
<g transform="translate(250,1000)"><path d="M0 -15 l12 14 h-6.5 v14 h-11 v-14 h-6.5 z" fill="var(--hite)"/></g>
<text class="hd" x="300" y="984">1996.07 · 40년 만의 1위 교체</text>
<text class="bd" x="300" y="1008">페놀 사건으로 OB가 흔들린 틈에</text>
<text class="bd" x="300" y="1029"><tspan class="pr">하이트</tspan>가 3년 만에 판을 뒤집는다.</text>
<text class="bd" x="300" y="1050">조선맥주 점유율 <tspan class="pr">30%</tspan>(1993) → <tspan class="pr">43%</tspan>(1996).</text>
<text class="bd" x="300" y="1071">1948년 이래 이어진 OB 1위 체제가 끝난다.</text>

<rect x="861" y="1096" width="18" height="18" rx="4" fill="var(--jinro)" stroke="var(--panel)" stroke-width="4"/>
<text class="bd" x="846" y="1112" text-anchor="end">진로그룹 부도</text>

<circle class="disc" cx="250" cy="1165" r="24" stroke="var(--hite)"/>
<circle class="disc" cx="640" cy="1165" r="24" stroke="var(--ob)"/>
<text class="bd" x="300" y="1160">사명을 <tspan class="pr">하이트맥주</tspan>(주)로 변경</text>
<text class="bd" x="690" y="1160">인터브루와 합작</text>

<circle class="disc" cx="990" cy="1255" r="30" stroke="var(--jinro)"/>
<g transform="translate(990,1255)"><path d="M12 0 h-20 M-2 -8 l-10 8 10 8" fill="none" stroke="var(--jinro)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M1022 1255 H1195" stroke="var(--jinro)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fj" x="1210" y="1246" style="font-size:18.2px">1999 · OB, 진로쿠어스 인수</text>
<text class="bd" x="1210" y="1270">진로 부도로 매물이 된 맥주 부문을 OB가 인수.</text>
<text class="bd" x="1210" y="1291"><tspan class="pr">카스</tspan>는 이때부터 지금까지 OB 제품이다.</text>
<circle class="disc" cx="640" cy="1325" r="20" stroke="var(--ob)"/>
<text class="bd" x="676" y="1331" style="font-weight:700;fill:var(--ob)">← <tspan class="pr">카스</tspan> 편입 (현재까지 OB 제품)</text>

<circle class="disc" cx="870" cy="1385" r="24" stroke="var(--jinro)" stroke-width="4"/>
<g transform="translate(870,1385)"><path d="M12 0 h-20 M-2 -8 l-10 8 10 8" fill="none" stroke="var(--jinro)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M902 1385 H1195" stroke="var(--jinro)" stroke-width="2.6" stroke-dasharray="3 6" fill="none"/>
<text class="hd fj" x="1210" y="1376" style="font-size:18.2px">2005 · 하이트, 진로 인수</text>
<text class="bd" x="1210" y="1400">3조 4,100억 원. 이번엔 <tspan class="pr">소주</tspan> 부문이</text>
<text class="bd" x="1210" y="1421">반대편 하이트로 — 카스와 정반대 방향.</text>

<text class="bd" x="300" y="1512" style="font-weight:700;fill:var(--hite)">← <tspan class="pr">진로</tspan>(소주) 편입 — 카스와 정반대 방향</text>
<circle class="disc" cx="250" cy="1475" r="24" stroke="var(--hite)"/>
<text class="hd" x="300" y="1470" style="font-size:18.2px">2011 · <tspan class="pr">하이트진로</tspan> 출범</text>

<circle class="disc" cx="640" cy="1565" r="24" stroke="var(--ob)"/>
