  <stop offset="0" stop-color="var(--jinro)"/><stop offset="0.45" stop-color="var(--jinro)"/><stop offset="1" stop-color="var(--ob)"/>
</linearGradient>
<linearGradient id="g05" x1="870" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="var(--jinro)"/><stop offset="0.4" stop-color="var(--jinro)"/><stop offset="1" stop-color="var(--hite)"/>
