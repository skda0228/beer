<text class="hd ft" x="1210" y="1556" style="font-size:18.2px">2014 · <tspan class="pr">클라우드</tspan> 출시</text>
<text class="bd" x="1210" y="1580">두 선이 81년을 달린 뒤 진입한</text>
<text class="bd" x="1210" y="1601">4번째 메이저.</text>

<circle class="disc" cx="250" cy="1655" r="28" stroke="var(--hite)"/>
