<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="2332" viewBox="0 -46 1590 2332" role="img" aria-label="한국 맥주 계보도. 1933년 조선맥주와 소화기린맥주가 서로 다른 일본 자본으로 설립되고, 1948년 소화기린은 동양맥주로 바뀌며 상표 OB가 등장한 뒤 1995년 사명까지 OB맥주가 된다. 두 선은 90년간 만나지 않는다. 1992년 진로쿠어스가 세워져 1994년 카스를 내지만 1999년 카스는 OB로, 2005년 진로 자신은 하이트로 넘어가며 두 선이 교차한다. 롯데는 2014년 클라우드로 진입한다."><style>
  :root{
    --ground:#F4F5F2; --panel:#FFFFFF; --ink:#1A1D1F; --ink-2:#4A5157; --ink-3:#8A9098;
    --rule:#DDE0DC;
    --hite:#0F7A6E; --ob:#C0332F; --jinro:#B8860B; --lotte:#5B4B9E; --craft:#2274C4; --new:#DC2626; --jp:#8A9098; --trunk:#8A9098;
    --shadow:0 2px 4px rgba(26,29,31,.06), 0 12px 32px -16px rgba(26,29,31,.24);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#101315; --panel:#181C1F; --ink:#E9ECEE; --ink-2:#A9B0B6; --ink-3:#798087;
      --rule:#2A2F33;
      --hite:#3FC5B4; --ob:#EE7A72; --jinro:#E0B04A; --lotte:#9C8CE0; --craft:#5AA5EE; --new:#FF8A80; --jp:#798087; --trunk:#798087;
      --shadow:0 2px 4px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#101315; --panel:#181C1F; --ink:#E9ECEE; --ink-2:#A9B0B6; --ink-3:#798087;
    --rule:#2A2F33;
    --hite:#3FC5B4; --ob:#EE7A72; --jinro:#E0B04A; --lotte:#9C8CE0; --craft:#5AA5EE; --new:#FF8A80; --jp:#798087; --trunk:#798087;
    --shadow:0 2px 4px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 72px}
  header{padding:52px 0 26px}
  h1{margin:0;font-size:clamp(1.8rem,4.6vw,2.9rem);font-weight:850;letter-spacing:-.04em;line-height:1.14;text-wrap:balance}
  .sub{margin:14px 0 0;max-width:56ch;color:var(--ink-2);font-size:1.02rem;text-wrap:pretty}
  figure{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
  .canvas{overflow-x:auto;padding:10px}
  figure svg{display:block;min-width:940px;width:100%;height:auto}
  figcaption{padding:16px 22px;border-top:1px solid var(--rule);font-size:.87rem;color:var(--ink-2)}
  figcaption b{color:var(--ink)}

  .rib{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
  .rib.thin{stroke-width:7}
  .rib.trunk{stroke:var(--trunk);stroke-width:19}
  .rib.gh{stroke-width:6;stroke-dasharray:3 11;opacity:.75}
  .rib.soju{stroke-width:5.5;opacity:.6}
  .h{stroke:var(--hite)} .b{stroke:var(--ob)} .j{stroke:var(--jinro)}
  .t{stroke:var(--lotte)} .g{stroke:var(--jp)}
  .fh{fill:var(--hite)} .fb{fill:var(--ob)} .fj{fill:var(--jinro)}
  .ft{fill:var(--lotte)} .fg{fill:var(--jp)}
  .disc{fill:var(--panel);stroke-width:5}
  .yr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums}
  .grid{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:2 7}
  .hd{font-size:19.4px;font-weight:800;fill:var(--ink)}
  .bd{font-size:15.1px;font-weight:500;fill:var(--ink-2)}
  .nm{font-size:16.9px;font-weight:800}
  .shp{font-size:16.5px;font-weight:800;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .pr{font-weight:800;fill:var(--new)}
  .shn{font-size:12.7px;font-weight:600;fill:var(--ink-3)}
  .axn{font-size:13.3px;fill:var(--ink-3);font-family:ui-monospace,Menlo,monospace}
  .lab{margin:0 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;
    font-weight:800;letter-spacing:.2em;color:var(--ink)}
  .labfoot{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;letter-spacing:.14em;color:var(--ink-3)}
  .labfoot b{font-weight:800;letter-spacing:.2em;color:var(--ink)}
  .svglab{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.18em;fill:var(--ink)}
</style><rect x="0" y="-46" width="1590" height="2332" fill="var(--panel)"/>
