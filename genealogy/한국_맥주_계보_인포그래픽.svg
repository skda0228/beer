<path class="rib g gh" d="M250 128 L250 200"/><path class="rib g gh" d="M640 128 L640 310"/>
<text class="bd" x="250" y="92" text-anchor="middle" style="font-weight:700">대일본맥주 (日)</text>
<text class="bd" x="250" y="112" text-anchor="middle" style="font-size:13.5px">現 삿포로 · 아사히 계열</text>
<text class="bd" x="640" y="92" text-anchor="middle" style="font-weight:700">기린맥주 (日)</text>
<text class="bd" x="640" y="112" text-anchor="middle" style="font-size:13.5px">現 기린홀딩스</text>
<text class="bd" x="700" y="150" style="font-size:13.5px">1933년 <tspan style="font-weight:700">설립 자본일 뿐</tspan> — 1945년 광복 후 적산기업으로 접수되며 자본 관계가 끊긴다.</text>
<text class="bd" x="700" y="171" style="font-size:13.5px">오늘의 하이트진로·OB맥주는 이 두 일본 회사와 지분·경영상 <tspan style="font-weight:700">무관하다.</tspan></text>
