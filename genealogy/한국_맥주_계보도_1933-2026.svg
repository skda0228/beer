<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1470" viewBox="0 0 1160 1470" role="img"
           aria-label="한국 맥주 계보도. 1933년 8월 대일본맥주 자본으로 조선맥주가, 같은 해 12월 기린맥주 자본으로 소화기린맥주가 설립되어 각각 하이트진로와 OB맥주가 된다. 두 선은 90년간 만나지 않는다. 1992년 진로그룹이 쿠어스와 합작해 진로쿠어스를 만들고 1994년 카스를 출시하지만, 1999년 카스는 OB로 넘어가고 2005년 진로 자신은 하이트에 인수되어 두 선이 서로 교차한다. 롯데는 2014년 클라우드로 뒤늦게 진입한다.">
<style>
  :root{
    --ground:#EFF2F5; --panel:#FFFFFF; --panel-2:#F7F9FB; --ink:#12161D; --ink-2:#48515F; --ink-3:#798393;
    --rule-2:#E6EAEF;
    --kirin:#1B7A4B; --sapporo:#A0721A; --asahi:#1F5FA8; --yebisu:#932F48;
    --suntory:#57429E; --orion:#0A716E; --trunk:#454B57;
    --hite:#12736A; --ob:#AE3244; --jinro:#A0721A; --lotte:#57429E; --craft:#1F5FA8; --jp:#798393;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0E1116; --panel:#161A21; --panel-2:#1B2028; --ink:#E7EAF0; --ink-2:#A7AFBD; --ink-3:#767F8E;
      --rule-2:#232932;
      --kirin:#4FC183; --sapporo:#DFA845; --asahi:#63A3E8; --yebisu:#E17E96;
      --suntory:#9E8AE0; --orion:#3EC0BA; --trunk:#AEB6C4;
      --hite:#3FBDAF; --ob:#E8798C; --jinro:#DFA845; --lotte:#9E8AE0; --craft:#63A3E8; --jp:#7C8695;
    }
  }
  .bg{fill:var(--panel)}
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
  .lane{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  .lane.thin{stroke-width:3}
  .lane.trunk{stroke-width:8.5;stroke:var(--trunk)}
  .lane.ghost{stroke-width:2.5;stroke-dasharray:2 7;opacity:.62}
  .k{stroke:var(--kirin)} .s{stroke:var(--sapporo)} .a{stroke:var(--asahi)}
  .y{stroke:var(--yebisu)} .u{stroke:var(--suntory)} .o{stroke:var(--orion)}
  .fk{fill:var(--kirin)} .fs{fill:var(--sapporo)} .fa{fill:var(--asahi)}
  .fy{fill:var(--yebisu)} .fu{fill:var(--suntory)} .fo{fill:var(--orion)}
  .h{stroke:var(--hite)} .b{stroke:var(--ob)} .j{stroke:var(--jinro)}
  .t{stroke:var(--lotte)} .g{stroke:var(--jp)}
  .fh{fill:var(--hite)} .fb{fill:var(--ob)} .fj{fill:var(--jinro)}
  .ft{fill:var(--lotte)} .fg{fill:var(--jp)} .fc{fill:var(--craft)}
  .dot{stroke:var(--panel);stroke-width:2.5}
  .yr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:var(--ink-3)}
  .yr.big{font-size:17px;fill:var(--ink)}
  .lbl{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .lbl.sub{font-size:11px;font-weight:500;fill:var(--ink-3)}
  .lbl.big{font-size:14px;font-weight:750}
  .foot{font-size:13.5px;font-weight:750;fill:var(--ink)}
  .gridline{stroke:var(--rule-2);stroke-width:1}
  .band{fill:var(--trunk);opacity:.055}
  .axnote{font-size:10.5px;fill:var(--ink-3);font-family:ui-monospace,Menlo,monospace}
  .bar{fill:var(--craft)}
  .barlab{font-size:12px;font-weight:700;fill:var(--ink);font-family:ui-monospace,Menlo,monospace}
</style>
<rect class="bg" x="0" y="0" width="1160" height="1470"/>

        <!-- ── 일본 모자본 점선 ── -->
        <path class="lane g ghost" d="M210 128 L210 178"/>
        <path class="lane g ghost" d="M520 128 L520 238"/>
        <text class="lbl sub" x="210" y="112" text-anchor="middle">대일본맥주 (日)</text>
        <text class="lbl sub" x="520" y="112" text-anchor="middle">기린맥주 (日)</text>

        <!-- ── 하이트진로 계보 ── -->
        <path class="lane h" d="M210 178 L210 1340"/>

        <!-- ── OB 계보 ── -->
        <path class="lane b" d="M520 238 L520 1340"/>

        <!-- ── 진로그룹 (소주) ── -->
        <path class="lane j ghost" d="M780 400 L780 540"/>
        <path class="lane j" d="M780 540 L780 952"/>
        <!-- 2005 : 진로 → 하이트 (OB 선을 가로지름) -->
        <path class="lane j" d="M780 952 C780 992 210 962 210 1002"/>

        <!-- ── 진로쿠어스 (맥주 JV) ── -->
        <path class="lane j thin" d="M780 540 C780 574 920 556 920 590 L920 878"/>
        <!-- 1999 : 카스 → OB (진로그룹 선을 가로지름) -->
        <path class="lane j thin" d="M920 878 C920 916 520 890 520 926"/>

        <!-- ── 롯데 ── -->
        <path class="lane t" d="M1070 1086 L1070 1340"/>

        <!-- ══════ 노드 · 라벨 ══════ -->

        <!-- 1933.08 조선맥주 -->
        <text class="yr" x="70" y="183" text-anchor="end">1933</text>
        <circle class="dot fh" cx="210" cy="178" r="7"/>
        <text class="lbl" x="248" y="174">조선맥주 (주)</text>
        <text class="lbl sub" x="248" y="189">8월 · 대일본맥주 자본 — 상표 크라운</text>

        <!-- 1933.12 소화기린 -->
        <circle class="dot fb" cx="520" cy="238" r="7"/>
        <text class="lbl" x="558" y="234">소화기린맥주 (주)</text>
        <text class="lbl sub" x="558" y="249">12월 · 기린맥주 자본 — 상표 오비</text>

        <!-- 1948 -->
        <text class="yr" x="70" y="325" text-anchor="end">1948</text>
        <circle class="dot fh" cx="210" cy="320" r="6"/>
        <circle class="dot fb" cx="520" cy="320" r="6"/>
        <text class="lbl sub" x="558" y="324">적산기업 → 동양맥주 · 조선맥주로 민간 이관</text>

        <!-- 1991 페놀 -->
        <text class="yr" x="70" y="475" text-anchor="end">1991</text>
        <rect x="512" y="462" width="16" height="16" rx="2" fill="var(--ob)" stroke="var(--panel)" stroke-width="2.5"/>
        <text class="lbl" x="558" y="466">낙동강 페놀 유출</text>
        <text class="lbl sub" x="558" y="482">두산(OB 모기업) 계열 · 전국 불매운동</text>

        <!-- 1992 진로쿠어스 -->
        <text class="yr" x="70" y="545" text-anchor="end">1992</text>
        <circle class="dot fj" cx="780" cy="540" r="7"/>
        <text class="lbl" x="780" y="378" text-anchor="middle">진로그룹 (소주)</text>
        <text class="lbl sub" x="780" y="393" text-anchor="middle">맥주 아님</text>
        <text class="lbl" x="962" y="600">진로쿠어스맥주</text>
        <text class="lbl sub" x="962" y="615">미국 쿠어스 합작</text>

        <!-- 1993 하이트 -->
        <text class="yr" x="70" y="603" text-anchor="end">1993</text>
        <circle class="dot fh" cx="210" cy="598" r="7"/>
        <text class="lbl" x="248" y="594">하이트 출시</text>
        <text class="lbl sub" x="248" y="609">"지하 150m 암반수" — 페놀 사건의 반사 마케팅</text>

        <!-- 1994 카스 -->
        <text class="yr" x="70" y="657" text-anchor="end">1994</text>
        <circle class="dot fj" cx="920" cy="652" r="6"/>
        <text class="lbl sub" x="962" y="656">카스 출시</text>

        <!-- 1996 역전 -->
        <text class="yr" x="70" y="711" text-anchor="end">1996</text>
        <circle class="dot fh" cx="210" cy="706" r="6"/>
        <text class="lbl" x="248" y="702">하이트, OB 추월</text>
        <text class="lbl sub" x="248" y="717">40년 만의 1위 교체 · 점유율 30%→43%</text>

        <!-- 1997 부도 -->
        <text class="yr" x="70" y="765" text-anchor="end">1997</text>
        <rect x="772" y="752" width="16" height="16" rx="2" fill="var(--jinro)" stroke="var(--panel)" stroke-width="2.5"/>
        <text class="lbl sub" x="756" y="766" text-anchor="end">진로그룹 부도</text>

        <!-- 1998 -->
        <text class="yr" x="70" y="823" text-anchor="end">1998</text>
        <circle class="dot fh" cx="210" cy="818" r="6"/>
        <circle class="dot fb" cx="520" cy="818" r="6"/>
        <text class="lbl sub" x="248" y="822">사명을 하이트맥주로 변경</text>
        <text class="lbl sub" x="558" y="822">벨기에 인터브루와 합작</text>

        <!-- 1999 카스 → OB -->
        <line class="gridline" x1="90" y1="878" x2="1120" y2="878"/>
        <text class="yr big" x="70" y="883" text-anchor="end">1999</text>
        <circle class="dot fj" cx="920" cy="878" r="7.5"/>
        <text class="lbl big" x="962" y="874">OB, 진로쿠어스 인수</text>
        <text class="lbl sub" x="962" y="890">카스가 경쟁사의 간판이 된다</text>
        <circle class="dot fb" cx="520" cy="926" r="6"/>

        <!-- 2005 진로 → 하이트 -->
        <line class="gridline" x1="90" y1="952" x2="1120" y2="952"/>
        <text class="yr big" x="70" y="957" text-anchor="end">2005</text>
        <circle class="dot fj" cx="780" cy="952" r="7.5"/>
        <text class="lbl big" x="822" y="948">하이트, 진로 인수</text>
        <text class="lbl sub" x="822" y="964">3조 4,100억 — 카스를 낳은 회사가 반대편으로</text>

        <!-- 2011 -->
        <text class="yr" x="70" y="1019" text-anchor="end">2011</text>
        <circle class="dot fh" cx="210" cy="1014" r="6"/>
        <text class="lbl" x="248" y="1010">하이트진로 출범</text>

        <!-- 2014 -->
        <text class="yr" x="70" y="1091" text-anchor="end">2014</text>
        <circle class="dot fb" cx="520" cy="1086" r="6"/>
        <circle class="dot ft" cx="1070" cy="1086" r="7"/>
        <text class="lbl sub" x="558" y="1090">주주가 AB InBev로 변경</text>
        <text class="lbl" x="1046" y="1064" text-anchor="end">롯데 클라우드</text>
        <text class="lbl sub" x="1046" y="1079" text-anchor="end">4번째 메이저 진입</text>

        <!-- 2020 종량세 -->
        <line class="gridline" x1="90" y1="1160" x2="1120" y2="1160"/>
        <text class="yr big" x="70" y="1165" text-anchor="end">2020</text>
        <text class="lbl big" x="248" y="1156">종가세 → 종량세 전환</text>
        <text class="lbl sub" x="248" y="1172">수입맥주 세제 우위 소멸 · 크래프트 진입 장벽 하락</text>

        <!-- 2023 -->
        <text class="yr" x="70" y="1245" text-anchor="end">2023</text>
        <circle class="dot fh" cx="210" cy="1240" r="6"/>
        <circle class="dot ft" cx="1070" cy="1240" r="6"/>
        <text class="lbl sub" x="248" y="1244">켈리 출시 — 테라와 자기잠식</text>
        <text class="lbl sub" x="1046" y="1244" text-anchor="end">크러시 출시 → 2026 클라우드로 재통합</text>

        <!-- 현재 -->
        <line class="gridline" x1="90" y1="1290" x2="1120" y2="1290"/>
        <text class="yr big" x="70" y="1295" text-anchor="end">2026</text>

        <!-- 하단 -->
        <text class="foot fh" x="210"  y="1370" text-anchor="middle">하이트진로</text>
        <text class="foot fb" x="520"  y="1370" text-anchor="middle">OB맥주</text>
        <text class="foot ft" x="1070" y="1370" text-anchor="middle">롯데칠성</text>

        <text class="lbl sub" x="210"  y="1390" text-anchor="middle">테라 · 켈리 · 진로</text>
        <text class="lbl sub" x="520"  y="1390" text-anchor="middle">카스 · 한맥 — AB InBev 산하</text>
        <text class="lbl sub" x="1070" y="1390" text-anchor="middle">클라우드</text>

        <text class="axnote" x="90" y="1440">세로축은 사건 순서 — 연도 간격은 등간격이 아님</text>
      </svg>